<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>发布闲置 - 校园二手交易平台</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    footer{
      background:#333;
      color:#fff;
      padding:20px;
      text-align:center;
      margin-top:40px;
    }
  </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="index.html">校园二手交易平台</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="nav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="index.html">首页</a></li>
        <li class="nav-item"><a class="nav-link" href="goods.html">全部商品</a></li>
        <li class="nav-item"><a class="nav-link active" href="publish.html">发布闲置</a></li>
        <li class="nav-item"><a class="nav-link" href="about.html">关于我们</a></li>
      </ul>
    </div>
  </div>
</nav>
<div class="container mt-5" style="max-width:700px;">
  <h2 class="text-center mb-4">发布你的闲置物品</h2>
  <form id="publishForm">
    <div class="mb-3">
      <label class="form-label">商品名称 <span class="text-danger">*</span></label>
      <input type="text" class="form-control" id="name" placeholder="例如：高等数学教材">
    </div>
    <div class="mb-3">
      <label class="form-label">商品分类 <span class="text-danger">*</span></label>
      <select class="form-select" id="category">
        <option value="">请选择分类</option>
        <option>教材书籍</option>
        <option>数码产品</option>
        <option>宿舍用品</option>
        <option>衣物杂物</option>
      </select>
    </div>
    <div class="mb-3">
      <label class="form-label">售价(元) <span class="text-danger">*</span></label>
      <input type="number" class="form-control" id="price" placeholder="填写价格">
    </div>
    <div class="mb-3">
      <label class="form-label">商品描述</label>
      <textarea class="form-control" rows="4" placeholder="描述成色、交易方式等"></textarea>
    </div>
    <div class="mb-3">
      <label class="form-label">上传商品图片</label>
      <input type="file" class="form-control">
    </div>
    <div class="mb-3">
      <label class="form-label">你的联系方式 <span class="text-danger">*</span></label>
      <input type="text" class="form-control" id="contact" placeholder="QQ/微信">
    </div>
    <div class="text-center">
      <button type="submit" class="btn btn-primary">提交发布</button>
      <a href="index.html" class="btn btn-secondary ms-2">返回首页</a>
    </div>
  </form>
</div>
<footer>
  <p>校园二手交易平台 © 2026 小组课程作业</p>
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
//简单表单校验
const form = document.getElementById("publishForm");
form.addEventListener("submit",function(e){
  e.preventDefault();
  const name = document.getElementById("name").value;
  const category = document.getElementById("category").value;
  const price = document.getElementById("price").value;
  const contact = document.getElementById("contact").value;
  if(!name || !category || !price || !contact){
    alert("带*的项目不能为空！");
  }else{
    alert("提交成功！（静态页面模拟，不会真实保存）");
    form.reset();
  }
})
</script>
</body>
</html>
